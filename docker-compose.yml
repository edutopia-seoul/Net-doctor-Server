services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netdoctor}
      POSTGRES_USER: ${POSTGRES_USER:-netdoctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
  backend:
    build: ./backend
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-netdoctor}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-netdoctor}
      AGENT_API_KEY: ${AGENT_API_KEY:?set AGENT_API_KEY in .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.0.201:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    network_mode: host
    depends_on: [backend]
volumes:
  postgres_data:
